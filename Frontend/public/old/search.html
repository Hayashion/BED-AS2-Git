<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>JW Travel</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>

<body>
    <div class="container">
    </div>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"
        integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script>
        const token = localStorage.getItem("token");
        const loggedInUserID = parseInt(localStorage.getItem("loggedInUserID"));
        if (token === null || isNaN(loggedInUserID)) {
            window.location.href = "login.html";
        }
    </script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const country = urlParams.get('country');
        const price = urlParams.get('price');
        const period = urlParams.get('period')
        // API url
        const baseUrl = "http://localhost:8081";

        axios.get(`${baseUrl}/search`, { params: { country: country, price: price, period: period } })
            .then((response) => {
                const travels = response.data;
                console.log(travels);
                for (i=0;i<travels.length;i++){
                    if (travels[i].price>price){
                        travels[i].splice(i,1);
                    } 
                }
                console.log("hAHA");
                travels.forEach((record) => {
                        const recordHtml = `
                        <div class="col-4 card" style="margin-top: 2rem;">
                            <div class="card-body">
                            <b><p class="card-title">${record.title}</p></b>
                            <p class="card-price"><b>Price:</b> $${record.price}</p>
                            <p class="card-period"><b>Departure date:</b><br>${record.travelPeriod}</p>
                            <p class="card-country"><b>Country:</b> ${record.country}</p>
                            </div>
                            <div class="card-footer">
                                <a href="/itinerary.html?travelid=${record.travelid}">View Itinerary<a/>
                            </div>
                        </div>
                        `;
                    $("#search").append(recordHtml);
                    console.log($record.price,price)
                
                });
            })
            .catch((error) => {
                console.log(error);
            });

    </script>

    <div class="container">
        <nav class="nav">
            <a class="nav-link" href="/main.html">Home</a>
            <a class="nav-link" href="/users/">All Users</a>
        </nav>

        <div style="margin-top: 2rem;">
            <h1 id="page-title">Search Reesults</h1>
            <div class="container">
                <div id="search" class="row no-gutters">
                </div>
            </div>
        </div>
    </div>

</body>

</html>
